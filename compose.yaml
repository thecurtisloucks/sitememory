services:
  sitememory:
    build: .
    ports:
      - "3001:3001"
    environment:
      API_HOST: "0.0.0.0"
      API_PORT: "3001"
      WEB_ORIGIN: "http://localhost:3001"
      SERVE_WEB: "true"
      DATABASE_URL: "file:/data/sitememory.db"
      UPLOAD_DIR: "/data/uploads"
      VISION_PROVIDER: "${VISION_PROVIDER:-mock}"
      REASONING_PROVIDER: "${REASONING_PROVIDER:-mock}"
      META_API_KEY: "${META_API_KEY:-}"
      META_API_BASE_URL: "${META_API_BASE_URL:-https://api.meta.ai/v1}"
      META_SAM_MODEL: "${META_SAM_MODEL:-sam-3.1}"
      META_MUSE_MODEL: "${META_MUSE_MODEL:-muse-spark-1.3}"
    volumes:
      - sitememory-data:/data

volumes:
  sitememory-data:
